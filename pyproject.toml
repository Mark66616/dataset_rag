[project]
name = "dataset-rag"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "flagembedding>=1.3.5",
    "grandalf>=0.8",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.11",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.1.3",
    "loguru>=0.7.3",
    "magic-pdf>=1.3.12",
    "minio>=7.2.20",
    "modelscope>=1.35.1",
    "numpy>=2.4.3",
    "neo4j>=6.1.0",
    "openai-agents>=0.4.2",
    "pandas>=3.0.1",
    "pymilvus>=2.6.10",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "regex>=2026.2.28",
    "requests>=2.34.2",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
    "uvicorn>=0.42.0",
    "pytest>=8.0.0",
    "langgraph-checkpoint-mongodb>=0.4.0",
]

[tool.uv.sources]
# 强制从 NVIDIA 源安装（仅 Linux/GPU 服务器生效；macOS/Windows 自动回退 PyPI CPU 版）
torch = { index = "pytorch-cuda", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cuda", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cuda", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
